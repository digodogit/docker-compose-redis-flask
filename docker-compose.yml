services:
  app:
    build: ./app
    environment:
      REDIS_HOST: redis
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
